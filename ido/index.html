<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDO Prep · Prep Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: one reading column (max 760px), app-like cards on top, long-form serif for lessons. Accent = ink blue, highlight = jute gold. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#152033; --muted:#5b6678; --line:#dfe4ec;
  --accent:#2448c8; --accent-soft:#e8edfc; --gold:#a8701a; --gold-soft:#fbf1df;
  --good:#1d7f48; --good-soft:#e5f4eb; --bad:#b83227; --bad-soft:#fbe9e7;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --ink:#e6ebf2; --muted:#9aa5b5; --line:#283241;
  --accent:#8aa6ff; --accent-soft:#1c2744; --gold:#e3ad55; --gold-soft:#2c2416;
  --good:#5cc98a; --good-soft:#13291d; --bad:#f08a80; --bad-soft:#2f1a18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --ink:#e6ebf2; --muted:#9aa5b5; --line:#283241;
  --accent:#8aa6ff; --accent-soft:#1c2744; --gold:#e3ad55; --gold-soft:#2c2416;
  --good:#5cc98a; --good-soft:#13291d; --bad:#f08a80; --bad-soft:#2f1a18; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{padding-bottom:110px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:760px;margin:0 auto}
header.top .brand{font-weight:700;letter-spacing:-.01em;font-size:18px;text-decoration:none;color:var(--ink)}
header.top .brand span{color:var(--gold)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync span{white-space:nowrap}
@media (max-width:430px){#synctxt{display:none}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--gold)}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700;line-height:1.25}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.today{border-left:4px solid var(--gold);border-radius:0 var(--r) var(--r) 0}
.eyebrow{font-size:12px;font-weight:600;color:var(--gold);text-transform:none;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e131a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0e131a}}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:52px}
.li:first-child{border-top:0}
.li:hover{background:var(--accent-soft)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;font-size:15px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--bg);color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden} .bar>i{display:block;height:100%;background:var(--gold)}
button.check{background:transparent;padding:0;cursor:pointer;font-family:inherit;margin:0}
.check{width:24px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.check.on{background:var(--good);border-color:var(--good)}
/* lesson */
.lesson{font-family:var(--font-read);font-size:18px;line-height:1.7}
.lesson p,.lesson li{max-width:65ch}
.lesson ul,.lesson ol{padding-left:22px} .lesson li{margin:4px 0}
.lesson h2{font-family:var(--font-ui);font-size:19px;margin:28px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lesson table{border-collapse:collapse;font-family:var(--font-ui);font-size:14px;margin:10px 0;width:100%}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;font-variant-numeric:tabular-nums}
.lesson th{background:var(--bg)}
.askline{font-family:var(--font-ui);font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;color:var(--accent)}
.facts{width:100%;border-collapse:collapse;font-size:14px}
.facts td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.facts tr:first-child td{border-top:0}
.facts td:first-child{color:var(--muted);width:46%}
.facts td:last-child{font-weight:600}
.traps{background:var(--gold-soft);border-radius:var(--r);padding:14px 16px}
.traps li{margin:6px 0}
.tablewrap{overflow-x:auto}
/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .lt{font-weight:700;color:var(--muted);min-width:18px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:15px}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qnav button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qnav button.cur{outline:2px solid var(--gold)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
/* ask sheet */
.fab{position:fixed;right:16px;bottom:80px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:999px;padding:0 18px;min-height:48px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:30;display:none}
.srch{padding:0 16px;max-height:42vh;overflow:auto}.srch:empty{display:none}
.srch .sh{font-size:12px;color:var(--muted);margin:8px 0 6px;display:flex;justify-content:space-between}
.srch .sr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px;line-height:1.45;background:var(--bg)}
.srch .sr mark{background:var(--gold-soft);color:inherit;padding:0 1px;border-radius:3px}
.srch .sr .sl{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.srch .sr{cursor:pointer}.srch .sr:hover,.srch .sr:focus{border-color:var(--accent);outline:none}
.jumpflash{animation:jf 2.4s ease-out}@keyframes jf{0%,40%{background:var(--gold-soft);box-shadow:0 0 0 6px var(--gold-soft)}100%{background:transparent;box-shadow:none}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:760px;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--line);display:none;flex-direction:column;max-height:82vh}
.sheet.open,.sheet-bg.open{display:flex}
.sheet-bg.open{display:block}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .msgs{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:160px}
.msg.u{align-self:flex-end;background:var(--accent-soft);padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:85%;font-size:15px}
.msg.a{font-family:var(--font-read);font-size:16.5px;line-height:1.6}
.msg.a ul{padding-left:20px;margin:6px 0}
.msg.a p{margin:0 0 8px}
.sheet form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.sheet textarea{flex:1;resize:none;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px;max-height:120px}
.ctx{font-size:12px;color:var(--muted);padding:0 16px 8px}
.notice{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.err{color:var(--bad);font-size:13px}
input[type=date]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;background:var(--surface);min-height:52px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.day b{font-size:13px;font-variant-numeric:tabular-nums}
.day.now{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day.t-mock{background:var(--accent-soft)} .day.t-revise{background:var(--gold-soft)}
.day.done{opacity:.6}
/* lesson boxes */
.lesson .box{border-radius:12px;padding:12px 14px;margin:16px 0;font-family:var(--font-ui);font-size:15.5px;line-height:1.6}
.lesson .box p{margin:0 0 6px}.lesson .box p:last-child{margin:0}
.lesson .box .bh{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.lesson .box.story{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;font-family:var(--font-read);font-size:17px;font-style:italic}
.lesson .box.story .bh{font-style:normal;font-family:var(--font-ui);color:var(--gold)}
.lesson .box.trick{background:var(--gold-soft)}.lesson .box.trick .bh{color:var(--gold)}
.lesson .box.eng{background:var(--accent-soft)}.lesson .box.eng .bh{color:var(--accent)}
.lesson .box.twist{background:var(--bad-soft)}.lesson .box.twist .bh{color:var(--bad)}
.lesson .box code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--surface);padding:1px 5px;border-radius:5px}
.qc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:16px 0;font-family:var(--font-ui);font-size:15px}
.qc .bh{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.qc .qopts{display:grid;gap:6px;margin-top:8px}
.qc .qexp{margin-top:8px;font-size:14px}
.ring{width:84px;height:84px;flex:none}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:220px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;gap:10px}
.fc .front{font-size:19px;font-weight:700;line-height:1.35}
.fc .back{font-size:18px;color:var(--good);font-weight:600;line-height:1.4}
.fc .said{color:var(--muted);font-style:italic;max-width:95%}
.fc .verdict{font-size:14px;font-weight:600;padding:6px 10px;border-radius:10px}
.fc .verdict.ok{color:var(--good);background:var(--good-soft)}
.fc .verdict.part{color:#b7791f;background:rgba(227,173,85,.15)}
.fc .verdict.no{color:var(--bad);background:var(--bad-soft)}
.fc .pcs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 4px}
.fc .pc{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px dashed var(--muted);color:var(--text,inherit);opacity:.85}
.fc .pc.y{opacity:1;border-style:solid;color:var(--good);border-color:var(--good);background:var(--good-soft)}
.fc .pc.x{opacity:1;border-style:solid;color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.sp{font-size:14px;line-height:1.5;max-height:45vh;overflow:auto}
.sp>div{padding:4px 6px;border-radius:6px}
.sp .sp-head{font-weight:700;margin-top:6px}
.sp .sp-key{border-left:3px solid #e3ad55;padding-left:8px;background:rgba(227,173,85,.08)}
.sp .sp-p{color:var(--muted);text-align:center;padding:0}
.sp .now{background:rgba(227,173,85,.25)}
.rate .btn small{white-space:nowrap}
.rate .btn.primary small{color:inherit;opacity:.75}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button small{display:block;font-size:11px;color:var(--muted);font-weight:500}
/* visuals */
.viz{margin:18px 0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-family:var(--font-ui);font-size:14.5px;line-height:1.45}
.viz .vh{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.viz .vc{font-size:13px;color:var(--muted);margin-top:10px}
.viz code{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ti{position:relative;display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:10px;padding:5px 0}
.tl .ti:before{content:"";position:absolute;left:-19px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .ti.hi:before{background:var(--gold);border-color:var(--gold)}
.tl .y{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .ti.hi .y{color:var(--gold)}
.lad{display:flex;gap:6px;align-items:stretch}
.lad .st{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.lad .v{font-weight:700;font-size:14px;color:var(--ink);line-height:1.2}
.lad .bw{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.lad .b{width:78%;max-width:56px;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:6px 6px 2px 2px}
.lad .st:last-child .b{background:var(--gold-soft);border-color:var(--gold)}
.lad .l{font-size:12.5px;font-weight:600;line-height:1.25}
.lad .s{font-size:11.5px;color:var(--muted);line-height:1.2}
.sc{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sc .sg{overflow-wrap:anywhere;padding:8px 3px;text-align:center;font-weight:700;font-size:13px;min-width:0;border-right:1px solid var(--surface)}
.sc .sg:last-child{border-right:0}
.t-good{background:var(--good-soft);color:var(--good)}.t-gold{background:var(--gold-soft);color:var(--gold)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-accent{background:var(--accent-soft);color:var(--accent)}.t-muted{background:var(--bg);color:var(--muted)}
.scl{display:flex;margin-top:6px}
.scl span{min-width:0;text-align:center;font-size:12px;line-height:1.25;padding:0 2px}
.fl{display:flex;flex-direction:column;align-items:stretch}
.fl .fs{display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.fl .k{grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fl .t{font-weight:700}.fl .n{font-size:13px;color:var(--muted)}
.fl .fa{align-self:center;height:16px;width:2px;background:var(--line);position:relative;margin:2px 0}
.fl .fa:after{content:"";position:absolute;left:-4px;bottom:-2px;border:5px solid transparent;border-top-color:var(--muted)}
@media(min-width:720px){.fl{flex-direction:row;align-items:stretch}.fl .fs{flex:1;grid-template-columns:1fr}.fl .k{grid-row:auto;margin-bottom:4px}.fl .fa{height:2px;width:14px;margin:0 2px}.fl .fa:after{left:auto;right:-6px;bottom:-4px;border-top-color:transparent;border-left-color:var(--muted)}}
.vs{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vs .vr{display:grid;grid-template-columns:1fr 1fr}
.vs .vr span{padding:7px 10px;border-top:1px solid var(--line);font-size:13.5px}
.vs .vr span+span{border-left:1px solid var(--line)}
.vs .vhd span{border-top:0;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.vs .vhd span+span{background:var(--gold-soft);color:var(--gold)}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cds .cd{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.cds .k{font-size:20px;font-weight:800;color:var(--accent);line-height:1.1;overflow-wrap:anywhere}
.cds .t{font-weight:700;font-size:13.5px}.cds .n{font-size:12.5px;color:var(--muted)}
.wbmap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:420px;margin:0 auto}
.wbmap .mt{border:1px solid var(--line);border-radius:6px;padding:6px 2px;font-size:11px;font-weight:600;line-height:1.15;cursor:pointer;min-height:40px;font-family:var(--font-ui)}
.wbmap .mt.on{outline:2px solid var(--ink)}
.rg-n{background:var(--good-soft);color:var(--good)}.rg-w{background:var(--gold-soft);color:var(--gold)}.rg-h{background:var(--accent-soft);color:var(--accent)}.rg-c{background:var(--bad-soft);color:var(--bad)}
.viz .mi{margin-top:10px;font-size:13.5px;border-top:1px solid var(--line);padding-top:8px;min-height:40px}
/* drawn visuals */
.nfpa-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nfpa{width:170px;height:170px;flex:none}
.nfpa .nf-n{font-size:22px;font-weight:800;font-family:var(--font-ui)}
.nfpa-key{flex:1;min-width:170px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.nfpa-key i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial-svg{width:100%;max-width:280px}
.dial-svg .dl{font-size:11px;fill:var(--muted);font-family:var(--font-ui)}
.dial .needle{transition:transform .25s}
.dial-read{text-align:center}.dial-read .db{display:block;font-size:24px;font-weight:800}.dial-read .tm{font-size:15px;font-weight:600}
.dial input[type=range]{width:100%;max-width:300px;accent-color:var(--accent)}

<script>
window.PREP_ENV=(function(){
  const CFG={"clientId": "1051177919991-lfq04am73d56tti2seefav5v0a7em48d.apps.googleusercontent.com", "stats": {"modules": 7, "lessons": 70, "lessonQ": 803, "bankQ": 979, "hardQ": 119, "pastQ": 377, "cards": 1706, "visuals": 161, "interviewQ": 28}};
  const LSK="ps_ido_";
  const te=new TextEncoder(), td=new TextDecoder();
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=u=>{let s="";u.forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
  let CK=null, KEYS=null, resolveReady, NAME="";
  const ready=new Promise(r=>{resolveReady=r;});

  async function fetchKeys(force){const r=await fetch("keys.json",{cache:force?"reload":"no-cache"});if(!r.ok)throw new Error("keys");return r.json();}
  async function importCK(raw){return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);}
  async function decryptJSON(env){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(env.iv)},CK,b64d(env.ct));return JSON.parse(td.decode(pt));}
  function norm(code){return String(code||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
  async function unwrap(code){
    const c=norm(code); const id=c.slice(0,4), secret=c.slice(4);
    const e=KEYS.people[id]; if(!e||secret.length<8)throw new Error("code");
    const base=await crypto.subtle.importKey("raw",te.encode(secret),"PBKDF2",false,["deriveKey"]);
    const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(e.salt),iterations:KEYS.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(e.iv)},kek,b64d(e.wrapped)));
    let name="";try{if(e.nm)name=td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(e.iv2)},kek,b64d(e.nm)));}catch(x){}
    return {raw,id,name};
  }
  function gate(msg){
    const app=document.getElementById("app");const T=(CFG.stats||{});const nav=document.querySelector("nav.tabs");if(nav)nav.style.display="none";
    const fmt=n=>Number(n||0).toLocaleString("en-IN");
    const totalQ=(T.lessonQ||0)+(T.bankQ||0)+(T.hardQ||0)+(T.pastQ||0);
    const tile=(n,l)=>`<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums">${n}</div><div class="small muted" style="margin-top:2px;line-height:1.3">${l}</div></div>`;
    const row=(ic,t,d)=>`<div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:0 0 34px;height:34px;border-radius:10px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:17px">${ic}</div><div><b>${t}</b><div class="small muted" style="margin-top:2px">${d}</div></div></div>`;
    app.innerHTML=`<style>#gatecode:focus{outline:2px solid #a8701a;outline-offset:1px;border-color:#a8701a}@media (prefers-color-scheme:dark){#gatego{background:#e3ad55!important;border-color:#e3ad55!important;color:#16231f!important}}</style><div class="stack" style="max-width:520px;margin:18px auto 40px;gap:18px">
      <div style="background:#16231f;color:#fff;border-radius:16px;padding:22px 20px">
        <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e3ad55;font-weight:600">Prep Studio</div>
        <h1 style="color:#fff;margin:6px 0 6px;font-size:26px;line-height:1.2">WBPSC Industrial Development Officer</h1>
        <p style="margin:0;opacity:.92;font-size:15px">Your shortcut to IDO. The whole syllabus, made simple, made memorable, done in weeks.</p>
      </div>
      <form id="gateform" class="card stack" style="gap:8px">
        <label for="gatecode"><b>Enter your access code</b></label>
        <span class="small muted">Your personal code looks like <b>ab12-cd34-ef56</b>.</span>
        <input id="gatecode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx" style="font:inherit;font-size:19px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);letter-spacing:.08em;text-align:center">
        <button class="btn primary" type="submit" id="gatego" style="width:100%;background:#16231f;border-color:#16231f;color:#fff">Unlock my course</button>
        <div class="err" id="gateerr">${msg||""}</div>
        <span class="small muted">Unlocking takes a second or two. The course stays encrypted; your code is remembered on this device.</span>
      </form>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${tile(fmt(T.lessons),"lessons in "+(T.modules||7)+" subjects")}
        ${tile(fmt(totalQ),"practice questions")}
        ${tile(fmt(T.visuals),"visuals & games")}
        ${tile(fmt(T.pastQ),"past-paper questions")}
        ${tile(fmt(T.cards),"flashcards")}
        ${tile(fmt(T.hardQ),"time-trap questions")}
      </div>
      <div class="card stack" style="gap:14px">
        <div class="eyebrow">What's inside</div>
        ${row("📘","Every syllabus section, in depth","West Bengal industry, safety and pollution, environment and energy, physical science, computers, English, and arithmetic and reasoning. Short, bite-size lessons with stories, memory tricks and an engineer's view.")}
        ${row("🎯","Exam-true mock tests","100 questions in 90 minutes with the exam's section split and −0.25 marking. Time-trap questions train you to skip fast, and a time report shows where your minutes went.")}
        ${row("🧠","Remember more with less effort","Flashcards on a spaced-repetition schedule, match games, put-in-order timelines and printable cheat sheets.")}
        ${row("📅","A day-by-day plan to the exam","Each day's lesson, practice and revision, with a daily goal ring, streaks, speed drills and a crash-revision mode for the final weeks.")}
        ${row("🎤","Interview prep (15 marks)","Likely questions with answer outlines, official selection rules and timed practice, including Bengali.")}
      </div>
      <div class="card stack" style="gap:8px;background:var(--good-soft,#e9f6ee);border-color:transparent">
        <div class="eyebrow" style="color:var(--good)">Why you can trust it</div>
        <div class="small">Every lesson, visual and question has been checked by independent reviewers against official sources: gazettes, the Acts themselves, PIB, CPCB, MNRE and the WBPSC advertisement. Every calculation is recomputed and every puzzle brute-forced for a single answer. Past-paper answers were re-solved blind.</div>
      </div>
      <p class="small muted" style="text-align:center;margin:0">Your progress is saved privately in your own Google Drive.</p>
    </div>`;
    const inp=document.getElementById("gatecode"); inp.focus(); inp.oninput=()=>{document.getElementById("gateerr").textContent="";};
    document.getElementById("gateform").onsubmit=async e=>{
      e.preventDefault(); const v=inp.value.trim();
      if(!v){document.getElementById("gateerr").textContent="Enter your access code.";return;}
      const b=document.getElementById("gatego"); b.disabled=true; b.textContent="Unlocking…";
      try{const {raw,id,name}=await unwrap(v);CK=await importCK(raw);NAME=name||"";
        try{localStorage.setItem(LSK+"ck",JSON.stringify({v:KEYS.v,id,k:b64e(raw),n:NAME}));}catch(x){}
        app.innerHTML='<p class="muted">Loading your course…</p>'; if(nav)nav.style.display=""; resolveReady();
      }catch(err){b.disabled=false;b.textContent="Unlock my course";document.getElementById("gateerr").textContent="That code didn't work. Check it and try again, or ask for a new one.";}
    };
  }
  async function start(){
    if(!window.crypto||!crypto.subtle){document.getElementById("app").innerHTML='<p class="err">This browser can\'t unlock the course. Use a recent Chrome, Edge, Safari or Firefox.</p>';return;}
    try{KEYS=await fetchKeys(false);}catch(e){document.getElementById("app").innerHTML='<p class="err">Couldn\'t reach the course. Check your connection and reload.</p>';return;}
    let cached=null;try{cached=JSON.parse(localStorage.getItem(LSK+"ck")||"null");}catch(e){}
    if(cached&&cached.v===KEYS.v&&KEYS.people[cached.id]){try{CK=await importCK(b64d(cached.k));NAME=cached.n||"";resolveReady();return;}catch(e){}}
    gate(cached&&cached.v!==KEYS.v?"The course key has changed. Enter your code again.":"");
  }
  async function get(f,force){
    const r=await fetch("content/"+f+".enc",{cache:force?"reload":"no-cache"});
    if(!r.ok)throw new Error("fetch "+f);
    try{return await decryptJSON(await r.json());}
    catch(e){try{localStorage.removeItem(LSK+"ck");}catch(x){} location.reload(); throw e;}
  }

  /* ---- Google Drive (drive.file scope: only the file this app creates) ---- */
  const FNAME="prep-studio-ido-progress.json";
  let token=null, tokenExp=0, fileId=null, tc=null, saveT=null, pending=false;
  function btn(){return document.getElementById("drivebtn");}
  function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  async function api(url,opt){
    opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+token},opt.headers||{});
    const r=await fetch(url,opt); if(r.status===401){token=null;throw new Error("auth");} if(!r.ok)throw new Error("drive "+r.status); return r;
  }
  async function findFile(){
    const q=encodeURIComponent(`name='${FNAME}' and trashed=false`);
    const r=await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`);
    const j=await r.json(); return j.files&&j.files[0]?j.files[0].id:null;
  }
  async function upload(){
    const body=JSON.stringify({app:"prep-studio-ido",v:1,saved:new Date().toISOString(),state:S,notes:N});
    if(fileId){await api(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});return;}
    const meta={name:FNAME,mimeType:"application/json",description:"Progress for Prep Studio (WBPSC IDO). Safe to keep; delete to reset."};
    const fd=new FormData(); fd.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"})); fd.append("file",new Blob([body],{type:"application/json"}));
    const r=await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd}); fileId=(await r.json()).id;
  }
  async function pull(){
    fileId=await findFile(); if(!fileId){await upload();return;}
    const r=await api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`); const d=await r.json();
    let changed=false;
    if(d.state&&(d.state.last||0)>(S.last||0)){S=Object.assign(structuredClone(DEF),d.state);try{localStorage.setItem(LSK+"state",JSON.stringify(S));}catch(e){}changed=true;}
    if(d.notes&&(d.notes.last||0)>(N.last||0)){N=d.notes;if(!Array.isArray(N.items))N.items=[];try{localStorage.setItem(LSK+"notes",JSON.stringify(N));}catch(e){}changed=true;}
    if(!changed||(S.last||0)>((d.state||{}).last||0))await upload();
    if(changed)render(true);
  }
  function connected(){return token&&Date.now()<tokenExp-60000;}
  function setBtn(t,show){const b=btn();if(!b)return;b.hidden=!show;b.textContent=t;}
  async function connect(){
    try{await loadGIS();}catch(e){setSync("warn","Couldn't load Google sign-in");return;}
    if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:"https://www.googleapis.com/auth/drive.file",callback:async resp=>{
      if(resp.error){setSync("warn","Drive not connected");return;}
      token=resp.access_token; tokenExp=Date.now()+(resp.expires_in||3600)*1000;
      try{localStorage.setItem(LSK+"drive","1");}catch(e){}
      setSync("warn","Syncing with Drive…"); setBtn("Drive connected",false);
      try{await pull();setSync("ok","Synced to your Google Drive");pending=false;}catch(e){setSync("warn","Drive sync failed. Saved on this device");setBtn("Retry Drive sync",true);}
    }});
    tc.requestAccessToken({prompt:localStorage.getItem(LSK+"drive")?"":"consent"});
  }
  function save(){
    if(!CFG.clientId)return;
    clearTimeout(saveT); pending=true;
    saveT=setTimeout(async()=>{
      if(!connected()){setSync("warn","Saved on this device · reconnect Drive to sync");setBtn("Sync to Drive",true);return;}
      try{setSync("warn","Saving to Drive…");await upload();pending=false;setSync("ok","Synced to your Google Drive");}
      catch(e){setSync("warn","Drive save failed. Saved on this device");setBtn("Sync to Drive",true);}
    },2500);
  }
  function initCloud(){
    if(!CFG.clientId){setSync("","Saved on this device");return;}
    const h=document.querySelector("header.top"); if(h&&!btn()){const b=document.createElement("button");b.className="btn sm";b.id="drivebtn";b.onclick=connect;h.appendChild(b);}
    setSync("","Saved on this device");
    setBtn(localStorage.getItem(LSK+"drive")?"Sync to Drive":"Connect Google Drive",true);
  }
  window.addEventListener("beforeunload",e=>{if(pending&&connected()){e.preventDefault();e.returnValue="";}});
  document.addEventListener("DOMContentLoaded",start);
  return {mode:"gh",lsPrefix:LSK,ready,get,save,initCloud,userName:async()=>NAME,lock(){try{localStorage.removeItem(LSK+"ck");}catch(e){}location.reload();}};
})();

</script>

<script>
"use strict";
const ENV=window.PREP_ENV||{mode:"claude"};
const LS=ENV.lsPrefix||"ido_";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
/* letter sub/superscripts (ₙ, ⁿ) are missing from many fonts and show as boxes: draw those runs as real sub/sup text */
const SUBM={"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","₊":"+","₋":"−","ₙ":"n"};
const SUPM={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁺":"+","⁻":"−","ⁿ":"n"};
const GLYPH_RE=/[₀-₉₊₋ₙ]*ₙ[₀-₉₊₋ₙ]*|[⁰¹²³⁴-⁹⁺⁻ⁿ]*ⁿ[⁰¹²³⁴-⁹⁺⁻ⁿ]*/g;
function fixGlyphs(root){if(!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/[ₙⁿ]/.test(n.nodeValue)&&!(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(n.parentNode.nodeName))?1:3});
  const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(n=>{const svg=n.parentNode&&n.parentNode.namespaceURI==="http://www.w3.org/2000/svg";const t=n.nodeValue;const frag=document.createDocumentFragment();let last=0;
    t.replace(GLYPH_RE,(m,off)=>{if(off>last)frag.appendChild(document.createTextNode(t.slice(last,off)));const sub=/ₙ/.test(m);const txt=[...m].map(c=>(sub?SUBM:SUPM)[c]||c).join("");
      let el;if(svg){el=document.createElementNS("http://www.w3.org/2000/svg","tspan");el.setAttribute("baseline-shift",sub?"sub":"super");el.setAttribute("font-size","70%");}else el=document.createElement(sub?"sub":"sup");
      el.textContent=txt;frag.appendChild(el);last=off+m.length;return m;});
    if(last<t.length)frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n);});}
try{new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(x=>{if(x.nodeType===1)fixGlyphs(x);else if(x.nodeType===3&&x.parentNode)fixGlyphs(x.parentNode);});}).observe(document.body,{childList:true,subtree:true});}catch(e){}
document.addEventListener("DOMContentLoaded",()=>fixGlyphs(document.body));

const DAY=864e5;
const LETTERS=["A","B","C","D"];

/* ---------- content ---------- */
let MAN=null; const MODS={}; const LIDX={}; const QIDX={};
async function loadContent(force){
  const opt=force?{cache:"reload"}:{cache:"no-cache"};
  const get=ENV.get?(f=>ENV.get(f,force)):(async f=>(await fetch("content/"+f,opt)).json());
  const man=await get("manifest.json");
  for(const k in MODS)delete MODS[k]; for(const k in LIDX)delete LIDX[k]; for(const k in QIDX)delete QIDX[k];
  MAN=man;
  await Promise.all(MAN.modules.filter(m=>m.file).map(async m=>{
    try{
      const d=await get(m.file);
      MODS[m.id]=d;
      d.lessons.forEach(l=>{LIDX[l.id]={mid:m.id,l};l.mcqs.forEach(q=>{QIDX[q.id]={q,lid:l.id,mid:m.id};});});
    }catch(e){console.warn("module failed",m.id,e);}
  }));
  try{
    PYQ=await get("pyq.json");
    PYQ.papers.forEach(p=>{
      const L={id:p.id,title:p.title,summary:p.note,sections:[],facts:[],traps:[],recap:[],mcqs:p.questions,minutes:0,paper:true};
      LIDX[p.id]={mid:"pyq",l:L};
      p.questions.forEach(q=>{QIDX[q.id]={q,lid:p.id,mid:q.sec,pyq:true};});
    });
  }catch(e){PYQ=null;}
  try{IV=await get("interview.json");}catch(e){IV=null;}
  BANKN={};
  if(MAN.hard){try{const arr=await get(MAN.hard);arr.forEach(q=>{QIDX[q.id]={q,lid:q.lid,mid:q.mid,hard:true};HARDN++;});}catch(e){console.warn("hard pool failed");}}
  await Promise.all((MAN.banks||[]).map(async f=>{try{const arr=await get(f);arr.forEach(q=>{QIDX[q.id]={q,lid:q.lid,mid:q.mid,bank:true};BANKN[q.mid]=(BANKN[q.mid]||0)+1;});}catch(e){console.warn("bank failed",f);}}));
}
let PYQ=null, BANKN={};
const SECNAME=id=>id==="gs"?"Old GS":(modById(id)||{short:id}).short;
const modById=id=>MAN.modules.find(m=>m.id===id);
const lessonMeta=id=>{for(const m of MAN.modules){const l=m.lessons.find(x=>x.id===id);if(l)return{m,l};}return null;};
const allLessonCount=()=>MAN.modules.reduce((a,m)=>a+m.lessons.length,0);

/* ---------- state ---------- */
const DEF={v:1,done:{},qs:{},weak:[],mocks:[],start:null,last:0,seen:0,cards:{},days:{},newDay:null,plan:{},planDone:{}};
let S=structuredClone(DEF); let N={items:[],last:0};
try{const a=JSON.parse(localStorage.getItem(LS+"state")||"null");if(a)S=Object.assign(structuredClone(DEF),a);}catch(e){}
try{const b=JSON.parse(localStorage.getItem(LS+"notes")||"null");if(b)N=b;}catch(e){}
let DB=null,stRef=null,ntRef=null;
const saveTimers={},chain={s:Promise.resolve(),n:Promise.resolve()};
function setSync(kind,txt){$("#syncdot").className="dot "+(kind==="ok"?"ok":kind==="warn"?"warn":"");$("#synctxt").textContent=txt;}
function persist(kind){
  const obj=kind==="s"?S:N; obj.last=Date.now();
  try{localStorage.setItem(LS+(kind==="s"?"state":"notes"),JSON.stringify(obj));}catch(e){}
  if(ENV.save){ENV.save();return;}
  if(!DB)return;
  clearTimeout(saveTimers[kind]);
  saveTimers[kind]=setTimeout(()=>{
    const ref=kind==="s"?stRef:ntRef; const body=JSON.parse(JSON.stringify(obj));
    setSync("warn","Saving…");
    chain[kind]=chain[kind].then(()=>ref.set(body)).then(()=>setSync("ok","Synced")).catch(e=>{
      if(e&&e.code==="quota_exceeded")setSync("warn","Cloud storage full");
      else setSync("warn","Not synced, saved on this device");
    });
  },1200);
}
async function initCloud(){
  if(ENV.initCloud)return ENV.initCloud();
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    stRef=db.doc("data/users/"+id+"/state"); ntRef=db.doc("data/users/"+id+"/notes");
    setSync("warn","Connecting…");
    const to=setTimeout(()=>setSync("warn","Cloud not reachable yet"),10000);
    const [a,b]=await Promise.all([stRef.get(),ntRef.get()]);
    clearTimeout(to);
    DB=db;
    let pushS=true,pushN=true;
    if(a.exists){const c=a.data(); if((c.last||0)>=(S.last||0)){S=Object.assign(structuredClone(DEF),JSON.parse(JSON.stringify(c)));pushS=false;try{localStorage.setItem(LS+"state",JSON.stringify(S));}catch(e){}}}
    if(b.exists){const c=b.data(); if((c.last||0)>=(N.last||0)){N=JSON.parse(JSON.stringify(c));if(!Array.isArray(N.items))N.items=[];pushN=false;try{localStorage.setItem(LS+"notes",JSON.stringify(N));}catch(e){}}}
    if(pushS&&S.last)persist("s"); if(pushN&&N.last)persist("n");
    setSync("ok","Synced across devices");
    render(true);
  }catch(e){setSync("warn","Saved on this device only");}
}

/* ---------- helpers ---------- */
function startDate(){const s=S.start||MAN.start;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function todayIdx(){const t=new Date();t.setHours(0,0,0,0);return Math.floor((t-startDate())/DAY);}
function fmtDate(d){return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return (d.textContent||"").replace(/\s+\n/g,"\n").replace(/[ \t]+/g," ").trim();}
function lessonText(l){
  let t=l.title+"\n\n"+l.sections.map(s=>s.h+"\n"+stripHtml(s.html)).join("\n\n");
  t+="\n\nKey facts:\n"+l.facts.map(f=>"- "+f[0]+": "+f[1]).join("\n");
  t+="\n\nExam traps:\n"+l.traps.map(x=>"- "+x).join("\n");
  return t.slice(0,12000);
}
function md(text){
  const lines=esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split("\n");
  let out="",inList=false;
  for(const raw of lines){const ln=raw.trim();
    if(/^[-•*] /.test(ln)){if(!inList){out+="<ul>";inList=true;}out+="<li>"+ln.slice(2)+"</li>";continue;}
    if(inList){out+="</ul>";inList=false;}
    if(ln)out+="<p>"+ln+"</p>";}
  if(inList)out+="</ul>";return out;
}
function stats(){let c=0,w=0;for(const k in S.qs){if(!QIDX[k])continue;c+=S.qs[k].c;w+=S.qs[k].w;}return{c,w,acc:c+w?Math.round(100*c/(c+w)):null};}
const GOAL=40;
function dkey(t){t=t||new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function dayNum(){const t=new Date();return Math.floor((t.getTime()-t.getTimezoneOffset()*60000)/DAY);}
function bump(n){S.days=S.days||{};const k=dkey();S.days[k]=(S.days[k]||0)+n;const ks=Object.keys(S.days).sort();if(ks.length>150)ks.slice(0,ks.length-150).forEach(x=>delete S.days[x]);}
function todayPts(){return (S.days||{})[dkey()]||0;}
function streak(){let n=0;for(let i=0;i<400;i++){const v=(S.days||{})[dkey(new Date(Date.now()-i*DAY))]||0;if(v>=GOAL)n++;else if(i===0)continue;else break;}return n;}
function planStreak(){let n=0;for(let i=0;i<400;i++){const k=dkey(new Date(Date.now()-i*DAY));if((S.planDone||{})[k])n++;else if(i===0)continue;else break;}return n;}
function dayDate(i){return new Date(startDate().getTime()+i*DAY);}
function ensureDP(){if(S.migDP)return;S.dp=S.dp||{};S.dd=S.dd||{};
  for(const k in (S.plan||{})){const p=k.split("-").map(Number);if(p.length!==3)continue;const i=Math.round((new Date(p[0],p[1]-1,p[2])-startDate())/DAY);if(i<0)continue;S.dp[i]=Object.assign({},S.plan[k],S.dp[i]||{});}
  for(const k in (S.planDone||{})){const p=k.split("-").map(Number);if(p.length!==3)continue;const i=Math.round((new Date(p[0],p[1]-1,p[2])-startDate())/DAY);if(i>=0)S.dd[i]=1;}
  S.migDP=1;}
function planItems(ti){
  ensureDP();const e=MAN.calendar[ti]; const P=(S.dp||{})[ti]||{}; const out=[];const dk=dkey(dayDate(ti));
  const need=/50 questions/.test(e.task||"")?50:/2019 paper/.test(e.task||"")?99:/100 Q|Full mock/.test(e.task||"")?100:1;
  const mockDone=(S.mocks||[]).some(m=>(m.day===ti||(m.day==null&&dkey(new Date(m.ts))===dk))&&m.total>=need);
  if(e.core)out.push({k:"core",lid:e.core,done:!!S.done[e.core]});
  if(e.side)out.push({k:"side",lid:e.side,done:!!S.done[e.side]});
  if(e.side2&&LIDX[e.side2])out.push({k:"side2",lid:e.side2,done:!!S.done[e.side2]});
  if(e.side_task)out.push({k:"st",done:!!P.st});
  if(e.mod)out.push({k:"rv",done:!!P.rv});
  if(e.task)out.push({k:"tk",done:!!P.tk||(e.t==="mock"&&mockDone)});
  if(ti>0)out.push({k:"rc",done:!!P.rc});
  return out;
}
function syncDay(i){if(i<0||i>=MAN.calendar.length)return null;ensureDP();const it=planItems(i);const d=it.filter(x=>x.done).length;
  if(d===it.length){if(!S.dd[i])S.dd[i]=1;}else if(S.dd[i])delete S.dd[i];return {d,t:it.length};}
function activeDay(){const ti=todayIdx();if(ti<0||ti>=MAN.calendar.length)return ti;ensureDP();syncDay(ti);if(!S.dd[ti])return ti;
  for(let i=ti+1;i<MAN.calendar.length;i++){syncDay(i);if(!S.dd[i])return i;}return ti;}
function daysAhead(){const ti=todayIdx();if(ti<0)return 0;ensureDP();let n=0;for(let i=ti;i<MAN.calendar.length;i++){syncDay(i);if(S.dd[i])n++;else break;}return Math.max(0,n-1);}
function setPlan(key,val,day){ensureDP();const i=day==null?activeDay():day;S.dp[i]=S.dp[i]||{};const P=S.dp[i];if(val===undefined)val=!P[key];if(val)P[key]=1;else delete P[key];
  syncDay(i);syncPlanDone();persist("s");}
function syncPlanDone(){const ti=todayIdx();if(ti<0||ti>=MAN.calendar.length)return null;const r=syncDay(ti);
  S.planDone=S.planDone||{};const k=dkey();if(S.dd[ti]){if(!S.planDone[k]){S.planDone[k]=1;persist("s");}}else if(S.planDone[k]){delete S.planDone[k];persist("s");}return r;}
function allCards(){const out=[];for(const lid in S.done){const r=LIDX[lid];if(!r||r.l.paper)continue;(r.l.facts||[]).forEach((f,i)=>out.push({id:lid+"f"+i,lid,f:f[0],b:f[1]}));(r.l.cards||[]).forEach((c,i)=>out.push({id:lid+"c"+i,lid,f:c[0],b:c[1]}));}return out;}
function deck(){const today=dayNum();const st=S.cards||{};const all=allCards();const due=all.filter(c=>st[c.id]&&st[c.id].d<=today);const nt=(S.newDay&&S.newDay.d===today)?S.newDay.n:0;const fresh=all.filter(c=>!st[c.id]).slice(0,Math.max(0,(S.newPerDay||30)-nt));return {due,fresh,total:all.length,learned:all.filter(c=>st[c.id]).length};}
function rateCard(c,r){const today=dayNum();S.cards=S.cards||{};const old=S.cards[c.id];let i=old?old.i:0;
  if(r==="again")i=0;else if(r==="hard")i=Math.max(1,Math.round(i*1.2));else if(r==="good")i=i<1?1:Math.round(i*2.3);else i=i<1?4:Math.round(i*3.2);
  S.cards[c.id]={i,d:today+(r==="again"?0:i)};
  if(!old){S.newDay=(S.newDay&&S.newDay.d===today)?{d:today,n:S.newDay.n+1}:{d:today,n:1};}
  bump(1);persist("s");}
function ringSvg(p){const r=34,c=2*Math.PI*r,v=Math.min(1,p);return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="Daily goal ${Math.round(v*100)}%"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${v>=1?"var(--good)":"var(--gold)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${Math.round(v*100)}%</text></svg>`;}
function recordAnswer(qid,ok){bump(1);
  const r=S.qs[qid]||(S.qs[qid]={c:0,w:0,l:0});
  if(ok){r.c++;r.l=1;S.weak=S.weak.filter(x=>x!==qid);}else{r.w++;r.l=0;if(!S.weak.includes(qid))S.weak.push(qid);}
}
function moduleProgress(m){const d=m.lessons.filter(l=>S.done[l.id]).length;return{d,t:m.lessons.length};}

/* ---------- router ---------- */
function parseHash(){const h=(location.hash||"#home").slice(1);const i=h.indexOf("-");return i<0?{v:h,a:""}:{v:h.slice(0,i),a:h.slice(i+1)};}
let CUR_LESSON=null;

  const cur=TAB[v]||"today"; document.querySelectorAll("nav.tabs a").forEach(a=>{a.classList.toggle("on",a.dataset.tab===cur);if(a.dataset.tab===cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  if(v==="module")return viewModule(a);

  if(v==="mock")return viewMock(soft);
  if(v==="drill")return viewDrill(a);
  if(v==="sheet")return viewSheet(a);
  if(v==="crash")return viewCrash();
  if(v==="interview")return viewInterview(a);
  if(v==="voice")return viewVoice();
  if(v==="weak")return viewWeak();
  if(v==="notes")return viewNotes();
  if(v==="plan")return viewPlan();
  if(v==="learn")return viewLearn();
  if(v==="practice")return viewPractice();
  if(v==="progress")return viewProgress();
  if(v==="more")return viewMore();
  if(v==="cards")return viewCards();
  if(v==="numbers")return viewNumbers(a);
  if(v==="papers")return viewPapers();

  viewHome(); bindHome();
}
window.addEventListener("hashchange",()=>{try{stopSay();}catch(e){}try{if(CQ&&CQ.mic){CQ.mic.stop();CQ.mic=null;}}catch(e){}render();window.scrollTo(0,0);});

/* ---------- views ---------- */
function planEntryLabel(e){
  if(e.core){const lm=lessonMeta(e.core);return lm?lm.l.title:"";}
  if(e.mod){const m=modById(e.mod);return "Revise: "+m.title;}
  return e.task||"";
}
let USERNAME="";
function greetText(){const h=new Date().getHours();const g=h<5?"Burning the midnight oil":h<12?"Good morning":h<17?"Good afternoon":"Good evening";const first=(USERNAME||"").trim().split(/\s+/)[0];return first?`${g}, ${first}`:g;}
async function loadName(){try{let n="";if(ENV.userName)n=await ENV.userName();else if(window.claude&&claude.use){const u=await claude.use("user");if(u){const me=await u.me();n=me&&me.name||"";}}
  if(n){USERNAME=n;const el=document.getElementById("hello");if(el)el.textContent=greetText();}}catch(e){}}
function dayItems(ti,label){
    const cal=MAN.calendar;const e=cal[ti]; const d=dayDate(ti);
    const items=[]; const PI=Object.fromEntries(planItems(ti).map(x=>[x.k,x]));
    const ck=(k)=>`<button class="check ${PI[k]&&PI[k].done?"on":""}" data-pk="${k}" data-day="${ti}" aria-label="Mark as done">${PI[k]&&PI[k].done?"✓":""}</button>`;
    if(e.core){const lm=lessonMeta(e.core);const ok=!!LIDX[e.core];items.push(`<a class="li" href="${ok?"#lesson-"+e.core:"#module-"+lm.m.id}">${ck("core")}<span class="grow"><span class="small muted">${esc(lm.m.short)} · 75 min</span><br><span class="t">${esc(lm.l.title)}</span></span>${ok?"":'<span class="chip mute">Coming soon</span>'}</a>`);}
    if(e.side){const lm=lessonMeta(e.side);const ok=!!LIDX[e.side];items.push(`<a class="li" href="${ok?"#lesson-"+e.side:"#module-"+lm.m.id}">${ck("side")}<span class="grow"><span class="small muted">${esc(lm.m.short)} · 30 min</span><br><span class="t">${esc(lm.l.title)}</span></span>${ok?"":'<span class="chip mute">Coming soon</span>'}</a>`);}

    Promise.resolve().then(()=>TTS.speak(lines)).catch(()=>{}).then(()=>{if(my===PLAYN&&onDone)onDone();});return;}
  const v=pickVoice();
  const next=()=>{if(my!==PLAYN)return;if(i>=utts.length){if(onDone)onDone();return;}const n=i++;const u=utts[n];if(onStep)onStep(n);
    if(u.k==="pause"){setTimeout(next,u.ms||600);return;}
    const parts=u.t.match(/[^.!?]+[.!?]*/g)||[u.t];const rate=u.k==="key"?0.88:1;const after=u.k==="head"?400:u.k==="key"?600:150;
    setTimeout(()=>{if(my!==PLAYN)return;parts.forEach((p,j)=>speakDevice(p.trim(),v,j===parts.length-1?()=>setTimeout(next,after):null,rate));},u.k==="key"?300:0);};
  next();}
function stopScript(){PLAYN++;try{speechSynthesis.cancel();}catch(e){}try{if(TTS)TTS.stop();}catch(e){}}
async function setupListen(l){
  const b=$("#listen"),sb=$("#script");if(!b)return;
  if(!TTS&&window.claude&&claude.use){try{TTS=await claude.use("tts");}catch(e){TTS=null;}}
  if(!document.body.contains(b))return;
  const all=scriptUtterances(lessonScript(l));const panel=$("#scriptpanel");
  /* follow bite-size reading: only the part on screen, unless "Show all" is on */
  const st=()=>window.STEP&&window.STEP.id===l.id?window.STEP:{cur:0,n:l.sections.length,all:true};
  const partUtts=()=>{const s=st();if(s.all)return all;const u=all.filter(x=>x.sec===s.cur);
    u.push({t:"",k:"pause",ms:300});
    u.push({t:s.cur<s.n-1?"End of part "+(s.cur+1)+" of "+s.n+". Tap Next part when you're ready.":"That's the end of the lesson.",k:"head"});return u;};
  const showPanel=()=>{const u=partUtts();const s=st();panel.innerHTML=`<p class="small muted" style="margin:0 0 6px">${s.all?"The whole lesson":"Part "+(s.cur+1)+" of "+s.n}: exactly what the voice will say. Highlighted lines are read slower, with a pause.</p>`+u.map(x=>x.k==="pause"?'<div class="sp-p">· · ·</div>':`<div class="sp-${x.k}">${esc(x.t)}</div>`).join("");panel.hidden=false;sb.textContent="Hide spoken script";};
  if(sb){sb.hidden=false;sb.onclick=()=>{if(panel.hidden)showPanel();else{panel.hidden=true;sb.textContent="📝 Spoken script";}};}
  if(useDevice()&&!window.speechSynthesis)return;
  b.hidden=false;let on=false,mode=false;
  const label=()=>{if(document.body.contains(b))b.textContent=on?"Stop listening":mode?"Listen to this part":"Listen";};
  const play=()=>{stopSay();on=true;mode=true;label();if(!panel.hidden)showPanel();
    playScript(partUtts(),()=>{on=false;label();const c=panel.querySelector(".now");if(c)c.classList.remove("now");},
      n=>{if(panel.hidden)return;const rows=panel.querySelectorAll("div");rows.forEach(r=>r.classList.remove("now"));const r=rows[n];if(r){r.classList.add("now");r.scrollIntoView({block:"nearest",behavior:"smooth"});}});};
  b.onclick=()=>{if(on){stopScript();on=false;mode=false;label();return;}play();};
  const onStep=e=>{if(!document.body.contains(b)){window.removeEventListener("stepchange",onStep);return;}
    if(e.detail.id!==l.id)return;if(!panel.hidden)showPanel();
    if(on||mode){stopScript();on=false;play();}};
  window.addEventListener("stepchange",onStep);
}

let SIDX=null,STM=null;
const STOP=new Set("a an the is are was were be been of in on at to for and or not no with by from as that this these those what which who whom why how when where does do did can could should would will shall may might it its i me my we our you your he she they them their than then there here into about under over between after before also only very more most less least any all some much many such per vs course explain tell please mean means meaning know need give get something thing things odd doubt question answer why".split(" "));
function toks(t){return (t.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").match(/[a-z0-9][a-z0-9.+%₹/-]*/g)||[]).map(w=>w.replace(/[.\-/]+$/,"")).filter(w=>w&&!STOP.has(w));}
function stem(w){return w.length>4?w.replace(/(ings|ing|ies|ied|es|s|ed|ly)$/,""):w;}
function plain(h){const d=document.createElement("div");d.innerHTML=h.replace(/<!--viz-->[\s\S]*?<!--\/viz-->/g," ");return d.textContent.replace(/\s+/g," ").trim();}
function buildSIDX(){
  const E=[];const add=(t,kind,lid,href,sec)=>{t=String(t||"").trim();if(t.length<12)return;E.push({t,kind,lid,href,sec,w:new Set(toks(t).map(stem))});};
  for(const mid in MODS){(MODS[mid].lessons||[]).forEach(l=>{const href="#lesson-"+l.id;
    (l.sections||[]).forEach((sec,si)=>{const h=(sec.html||"").replace(/<!--viz-->[\s\S]*?<!--\/viz-->/g," ");
      const parts=h.split(/<\/(?:p|li|tr|div)>/i).map(plain).filter(x=>x.length>20);
      parts.forEach(x=>add((sec.h?sec.h+": ":"")+x,"Lesson",l.id,href,si));});
    (l.facts||[]).forEach(f=>add(f[0]+": "+f[1],"Key fact",l.id,href,999));
    (l.cards||[]).forEach(f=>add(f[0]+": "+f[1],"Key fact",l.id,href,999));
    (l.traps||[]).forEach(t=>add(t,"Exam trap",l.id,href,999));
    (l.mcqs||[]).forEach(q=>add(q.q+" Answer: "+q.o[q.a]+". "+(q.e||""),"Question",l.id,href));});}
  for(const k in QIDX){const r=QIDX[k];if(r.hard||!r.q||!r.q.o)continue;if(r.bank)add(r.q.q+" Answer: "+r.q.o[r.q.a]+". "+(r.q.e||""),"Question",r.lid,r.lid&&LIDX[r.lid]?"#lesson-"+r.lid:"");
    else if(r.pyq)add(r.q.q+" Answer: "+r.q.o[r.q.a]+". "+(r.q.e||""),"Past paper",r.lid,"");}
  if(IV)IV.cats.forEach(c=>c.qs.forEach(q=>add(q.q+" "+q.pts.join(" ")+" "+(q.trap||""),"Interview",null,"#interview")));
  const df={};E.forEach(e=>e.w.forEach(w=>{df[w]=(df[w]||0)+1;}));SIDX={E,df,N:E.length};
}
function searchCourse(q){
  if(!SIDX)buildSIDX();const qt=[...new Set(toks(q).map(stem))].filter(w=>w.length>1);if(!qt.length)return[];
  const idf=w=>Math.log(1+SIDX.N/(1+(SIDX.df[w]||0)));const ql=q.toLowerCase();
  const out=[];for(const e of SIDX.E){let sc=0,hit=0;for(const w of qt){if(e.w.has(w)){sc+=idf(w);hit++;}else if(w.length>=4){for(const x of e.w){if(x.startsWith(w)||(x.length>=4&&w.startsWith(x))){sc+=idf(w)*0.6;hit++;break;}}}}
    if(!hit||(qt.length>=3&&hit/qt.length<0.5))continue;sc*=hit/qt.length;if(qt.length>1&&hit===qt.length)sc*=1.3;
    if(ASK.lesson&&e.lid===ASK.lesson.id)sc*=1.25;if(e.kind==="Key fact"||e.kind==="Exam trap")sc*=1.1;
    out.push({e,sc});}
  out.sort((a,b)=>b.sc-a.sc);const top=out[0]?out[0].sc:0;const seen=new Set();
  return out.filter(x=>x.sc>=top*0.45).filter(x=>{const k=x.e.t.slice(0,80);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,6);
}
function hl(t,q){let s=t;if(s.length>320){const ws=toks(q).filter(w=>w.length>3);let i=-1;for(const w of ws){i=s.toLowerCase().indexOf(w.slice(0,5));if(i>=0)break;}const st=Math.max(0,i-90);s=(st?"… ":"")+s.slice(st,st+300)+(st+300<t.length?" …":"");}
  let h=esc(s);toks(q).filter(w=>w.length>2).map(w=>w.length>5?w.slice(0,w.length-2):w).sort((a,b)=>b.length-a.length).forEach(w=>{h=h.replace(new RegExp("(\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-z0-9]*)","gi"),"<mark>$1</mark>");});return h;}
function showSearch(){

  box.querySelectorAll(".sr").forEach(c=>{const go=()=>{const e=SIDX.E[+c.dataset.k];if(!e)return;

let QZ=null;
function recallLessons(day){for(let i=day-1;i>=0;i--){const e=MAN.calendar[i];const L=[e.core,e.side,e.side2].filter(x=>x&&LIDX[x]);if(L.length)return L;}return [];}
function buildQuiz(key){
  let ids=[],title="",back="#home",lesson=null;
  if(key==="weak"){ids=S.weak.filter(q=>QIDX[q]);title="Weak areas";back="#weak";}
  if(key==="rapid"){ids=shuffle(S.weak.filter(q=>QIDX[q])).slice(0,8);const need=15-ids.length;ids=ids.concat(shuffle(mockPool().filter(k=>!ids.includes(k))).slice(0,need));title="Rapid revision";back="#crash";}
  else if(key.startsWith("pp-")||key.startsWith("pps-")){const only=key.startsWith("pps-");const pid=key.slice(key.indexOf("-")+1);const p=PYQ&&PYQ.papers.find(x=>x.id===pid);if(p){ids=p.questions.filter(q=>!only||q.sec!=="gs").map(q=>q.id);title=p.title;back="#paper-"+pid;}}
  else if(key.startsWith("rc-")){const day=+key.slice(3);const L=recallLessons(day);const inL=k=>L.includes(QIDX[k].lid)&&!QIDX[k].hard;
    const all=Object.keys(QIDX).filter(inL);const fresh=k=>!(S.qs||{})[k];
    const tiers=[all.filter(k=>QIDX[k].bank&&fresh(k)),all.filter(k=>!QIDX[k].bank&&fresh(k)),all.filter(k=>!fresh(k)&&S.qs[k].w>0),all.filter(k=>!fresh(k)&&!(S.qs[k].w>0))];
    ids=[];tiers.forEach(t=>{if(ids.length<10)ids=ids.concat(shuffle(t).slice(0,10-ids.length));});ids=shuffle(ids);
    title="Recall test";back="#home";}
  else if(key.startsWith("mod-")){const mid=key.slice(4);const d=MODS[mid];if(d)d.lessons.forEach(l=>l.mcqs.forEach(q=>ids.push(q.id)));for(const k in QIDX)if(QIDX[k].bank&&QIDX[k].mid===mid)ids.push(k);title=modById(mid).title;back="#module-"+mid;ids=shuffle(ids);}
  else{const r=LIDX[key];if(r){ids=r.l.mcqs.map(q=>q.id);title=r.l.title;back="#lesson-"+key;lesson=r.l;}}
  return {key,title,back,lesson,items:ids.map(id=>({q:QIDX[id].q,id,lid:QIDX[id].lid})),i:0,ans:{},score:0};
}

  const ex=$("#qexpl"); if(ex)ex.onclick=()=>{const L=lm?lm.l:null;if(!L)return;openAsk({lesson:L,extra:`${q.q}\nOptions: ${q.o.map((o,j)=>LETTERS[j]+") "+o).join("; ")}\nCorrect: ${LETTERS[q.a]}. Learner chose: ${LETTERS[a]}.`,prefill:a===q.a?"Explain why the other options are wrong.":"Why is my answer wrong? Help me remember the right one."});};
}

function guessCoach(cf){
  if(!cf)return"";const neg=MAN.exam.negative;const net=x=>Math.round((x.c-neg*x.w)*100)/100;
  const tagged=cf.h.c+cf.h.w+cf.g.c+cf.g.w;
  const all={s:{c:0,w:0},h:{c:0,w:0},g:{c:0,w:0}};S.mocks.forEach(m=>{if(!m.cf)return;["s","h","g"].forEach(k=>{all[k].c+=m.cf[k].c;all[k].w+=m.cf[k].w;});});
  const pct=x=>x.c+x.w?Math.round(100*x.c/(x.c+x.w)):null;
  const row=(k,t)=>{const x=cf[k];return `<tr><td>${t}</td><td>${x.c+x.w}</td><td>${x.c} / ${x.w}</td><td><b>${net(x)>0?"+":""}${net(x)}</b></td></tr>`;};
  const verdict=k=>{const x=all[k],nn=x.c+x.w;if(!nn)return"";const p=Math.round(100*x.c/nn);if(nn<20)return `only ${nn} answers so far, too few to judge (right ${p}%)`;return x.c-MAN.exam.negative*x.w>0?`keep answering these (you're right ${p}% of the time; break-even is 20%)`:`these are costing you marks (only ${p}% right; break-even is 20%): skip them`;};
  return `<div class="card stack" style="gap:8px"><h2 style="margin:0">Guessing coach</h2>
   ${tagged?`<table class="facts"><tr><td><b>Tag</b></td><td><b>Answered</b></td><td><b>Right / wrong</b></td><td><b>Net marks</b></td></tr>${row("s","Sure")}${row("h","50-50")}${row("g","Guess")}${cf.n&&cf.n.c+cf.n.w?row("n","Not tagged"):""}</table>
   <p class="small" style="margin:0">Score if you had skipped your <b>guesses</b>: ${Math.round((MOCK.res.score-net(cf.g))*100)/100} (you scored ${MOCK.res.score}). If you had also skipped your <b>50-50s</b>: ${Math.round((MOCK.res.score-net(cf.g)-net(cf.h))*100)/100}.</p>
   <p class="small" style="margin:0">Across all your mocks: 50-50 answers: ${verdict("h")||"no data yet"}. Guesses: ${verdict("g")||"no data yet"}.</p>`:`<p class="small muted" style="margin:0">Tag answers Sure, 50-50 or Guess during the next mock to see whether guessing helps you.</p>`}
   <p class="small muted" style="margin:0">The maths: with 4 options and −0.25 per wrong answer, an answer pays off if you're right more than 20% of the time. A pure blind guess (25%) is barely positive (+0.06 marks on average); ruling out one option raises it to +0.17, ruling out two to +0.38.</p></div>`;
}

function mins(ms){const m=ms/60000;return m<1?Math.round(ms/1000)+" s":(Math.round(m*10)/10)+" min";}
function timeReport(R){
  if(!R.secT||!MOCK.tq)return "";
  const per=MAN.exam.minutes*60000/MAN.exam.questions; // fair time per question (54 s)
  const tot=Object.values(R.secT).reduce((a,b)=>a+b,0);
  const rows=MAN.modules.filter(m=>R.byMod[m.id]).map(m=>{const b=R.byMod[m.id];const t=R.secT[m.id]||0,fair=b.t*per;const d=t-fair;const flag=d>fair*0.25&&d>60000?"bad":d<-fair*0.4?"good":"mute";
    return `<tr><td>${esc(m.short)}</td><td><b>${mins(t)}</b></td><td>${mins(fair)}</td><td><span class="chip ${flag}">${d>=0?"+":"−"}${mins(Math.abs(d))}</span></td></tr>`;}).join("");
  const qs=MOCK.ids.map((id,i)=>({i,id,r:QIDX[id],t:(MOCK.tq||{})[i]||0,a:MOCK.ans[i]}));
  const res=x=>x.a==null?'<span class="chip mute">skipped</span>':x.a===x.r.q.a?'<span class="chip good">right</span>':'<span class="chip bad">wrong</span>';
  const slow=[...qs].sort((a,b)=>b.t-a.t).slice(0,5).filter(x=>x.t>0);
  const unseen=qs.filter(x=>!x.t&&x.a==null&&!x.r.hard);
  const hard=qs.filter(x=>x.r.hard);
  let hardHtml="";
  if(hard.length){const hT=hard.reduce((a,x)=>a+x.t,0);const quick=hard.filter(x=>x.a==null&&x.t<=20000).length;const sunk=hard.filter(x=>x.t>3*per);const hc=hard.filter(x=>x.a===x.r.q.a).length,hw=hard.filter(x=>x.a!=null&&x.a!==x.r.q.a).length;
    hardHtml=`<div class="card stack" style="gap:6px"><div class="eyebrow">Time traps (${hard.length} in this mock)</div>
      <p style="margin:0">You spent <b>${mins(hT)}</b> on them (fair share about ${mins(hard.length*per)}). Result: ${hc} right, ${hw} wrong, ${hard.length-hc-hw} skipped, net ${Math.round((hc-MAN.exam.negative*hw)*100)/100}.</p>
      <p class="small muted" style="margin:0">${quick} skipped within 20 seconds (good decisions). ${sunk.length?`<b>${sunk.length}</b> took over ${mins(3*per)} each: that time could have answered about ${Math.round(sunk.reduce((a,x)=>a+x.t,0)/per)} normal questions.`:`None took more than ${mins(3*per)}. Well handled.`}</p>
      <div class="small">${hard.map(x=>`<a data-go="${x.i}" class="chip ${x.a===x.r.q.a?"good":x.a==null?"mute":"bad"}" style="margin:2px">Q${x.i+1} · ${mins(x.t)}</a>`).join("")}</div></div>`;}
  const prev=S.mocks.filter(x=>x.secT&&x.label===MOCK.label).slice(-5);
  const trend=prev.length>1?`<div class="card tablewrap"><div class="eyebrow" style="margin-bottom:6px">Your trend (last ${prev.length} ${esc(MOCK.label.toLowerCase())}s, minutes per section)</div><table class="facts" style="min-width:320px"><tr><td><b>Section</b></td>${prev.map(x=>`<td><b>${new Date(x.ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</b></td>`).join("")}</tr>${MAN.modules.map(m=>`<tr><td>${esc(m.short)}</td>${prev.map(x=>`<td>${x.secT[m.id]!=null?Math.round(x.secT[m.id]/6000)/10:"–"}</td>`).join("")}</tr>`).join("")}</table></div>`:"";
  return `<h2>Where your time went</h2>
    <div class="card tablewrap"><table class="facts"><tr><td><b>Section</b></td><td><b>Spent</b></td><td><b>Fair</b></td><td><b>+/−</b></td></tr>${rows}</table>
    <p class="small muted" style="margin:8px 0 0">Fair = 54 seconds a question, the exam's average pace. Total time on questions: ${mins(tot)}.</p></div>
    ${unseen.length?`<p class="notice">Time ran out with <b>${unseen.length}</b> question${unseen.length>1?"s":""} never opened. Each could have been an easy mark.</p>`:""}
    ${hardHtml}
    ${slow.length?`<div class="card stack" style="gap:6px"><div class="eyebrow">Your 5 slowest questions</div>${slow.map(x=>`<a class="row" data-go="${x.i}" style="justify-content:space-between"><span class="small">Q${x.i+1} · ${esc(SECNAME(x.r.mid))}${x.r.hard?' · <span class="chip gold">time trap</span>':""}</span><span class="small"><b>${mins(x.t)}</b> ${res(x)}</span></a>`).join("")}</div>`:""}
    ${trend}`;
}

    if(b.dataset.r===sel){L.classList.remove("sel");L.classList.add("ok");b.classList.add("ok");done++;sel=null;bump(1);
      if(done===pool.length){$("#mgres").innerHTML=miss?`<b>All matched</b> with ${miss} slip${miss>1?"s":""}. Try a new set.`:"<b>Perfect!</b> All matched first time.";persist("s");}}
    else{miss++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),450);}});
  $("#mgnew").onclick=()=>matchGame(box,l);
}
const SLD={
 fan:{t:"Fan speed",min:20,max:100,step:5,v:80,u:"%",f:v=>{const p=Math.round(Math.pow(v/100,3)*1000)/10;return {big:`${p}% power`,small:`At ${v}% speed the fan draws ${p}% power (speed³). Saving: ${Math.round((100-p)*10)/10}%.`,bar:p};}},
 wind:{t:"Wind speed (× normal)",min:1,max:3,step:0.1,v:2,u:"×",f:v=>{const p=Math.pow(v,3);return {big:`${p.toFixed(1)}× power`,small:`Wind ${v.toFixed(1)}× as fast gives ${p.toFixed(1)}× the power (v³).`,bar:Math.min(100,p/27*100)};}},
 kmh:{t:"Speed in km/h",min:0,max:144,step:18,v:72,u:" km/h",f:v=>({big:`${(v*5/18).toFixed(0)} m/s`,small:`${v} × 5/18 = ${(v*5/18).toFixed(0)} m/s`,bar:v/144*100})},
 temp:{t:"Temperature in °C",min:-50,max:150,step:1,v:37,u:" °C",f:v=>{const F=v*9/5+32,K=Math.round((v+273.15)*100)/100;const tag=v===-40?"Celsius = Fahrenheit here":v===4?"Water is densest here":v===37?"Body temperature":v===100?"Water boils (sea level)":v===0?"Water freezes":"";return {big:`${F.toFixed(1)} °F · ${K} K`,small:`°F = 9/5 × ${v} + 32; K = °C + 273.15 (exams often round to 273)${tag?" · "+tag:""}`,bar:(v+50)/2};}},
 ph:{t:"pH",min:0,max:14,step:0.5,v:7,u:"",f:v=>{const ex=[[0,"1 M hydrochloric acid"],[1,"stomach acid"],[2,"lemon juice"],[3,"vinegar"],[5.5,"normal rain ~5.6"],[6.5,"milk ~6.5"],[7,"pure water"],[7.5,"blood ~7.4"],[8.5,"baking soda"],[10,"soap"],[12.5,"bleach"],[14,"caustic soda"]];let b=ex[0];ex.forEach(e=>{if(Math.abs(e[0]-v)<Math.abs(b[0]-v))b=e;});
   return {big:v<7?"Acidic":v>7?"Basic (alkaline)":"Neutral",small:`[H⁺] = 10^−${v} mol/L. Near this pH: ${b[1]}. Each whole pH unit is a 10× change in [H⁺].`,bar:v/14*100,col:v<7?"var(--bad)":v>7?"var(--accent)":"var(--good)"};}},
 ohm:{t:"Voltage (V) across a 6 Ω resistor",min:0,max:24,step:1,v:12,u:" V",f:v=>{const I=v/6,P=v*v/6;return {big:`${I.toFixed(2)} A · ${P.toFixed(1)} W`,small:`I = V/R = ${v}/6 = ${I.toFixed(2)} A; P = V × I = ${P.toFixed(1)} W`,bar:v/24*100};}},
 interest:{t:"Years at 10% on ₹10,000",min:1,max:10,step:1,v:2,u:" yr",f:v=>{const si=10000*0.1*v,ci=10000*(Math.pow(1.1,v)-1);return {big:`SI ₹${si.toLocaleString("en-IN")} · CI ₹${Math.round(ci).toLocaleString("en-IN")}`,small:`Compound earns ₹${Math.round(ci-si).toLocaleString("en-IN")} more. 2 years: gap = P × r² = ₹100.`,bar:Math.min(100,ci/16000*100)};}},
 clock:{t:"Clock time (minutes past 3:00)",min:0,max:55,step:5,v:30,u:" min",f:v=>{const H=3,ang=Math.abs(30*H-5.5*v),a=ang>180?360-ang:ang;let mh=11-H,mm=60-v;if(mm===60){mm=0;mh+=1;}return {big:`3:${String(v).padStart(2,"0")} → ${a}°`,small:`|30×3 − 5.5×${v}| = ${ang}°${ang>180?` → 360 − ${ang} = ${a}°`:""}. Mirror shows ${mh}:${String(mm).padStart(2,"0")}.`,bar:a/180*100,clock:[H,v]};}},
};
function hydrateSliders(){
  app.querySelectorAll(".sld").forEach(d=>{if(d.dataset.ready)return;d.dataset.ready="1";const P=SLD[d.dataset.p];if(!P)return;
    d.innerHTML=`${d.dataset.p==="clock"?'<svg class="clk" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>'+Array.from({length:12},(_,i)=>`<line x1="60" y1="10" x2="60" y2="${i%3?15:19}" stroke="var(--ink)" stroke-width="2" transform="rotate(${i*30} 60 60)"/>`).join("")+'<line class="hh" x1="60" y1="60" x2="60" y2="32" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><line class="mh" x1="60" y1="60" x2="60" y2="18" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="var(--ink)"/></svg>':""}<div class="sl-lab"><span>${P.t}</span><b class="sl-v"></b></div><input type="range" min="${P.min}" max="${P.max}" step="${P.step}" value="${P.v}"><div class="sl-bar"><i></i></div><div class="sl-big"></div><div class="sl-small"></div>`;
    const inp=d.querySelector("input");const up=()=>{const v=+inp.value;const r=P.f(v);d.querySelector(".sl-v").textContent=(P.step<1?v.toFixed(1):v)+P.u;d.querySelector(".sl-big").textContent=r.big;d.querySelector(".sl-small").textContent=r.small;
      const bar=d.querySelector(".sl-bar i");bar.style.width=Math.max(2,r.bar)+"%";bar.style.background=r.col||"var(--accent)";
      if(r.clock){d.querySelector(".hh").setAttribute("transform",`rotate(${r.clock[0]*30+r.clock[1]*0.5} 60 60)`);d.querySelector(".mh").setAttribute("transform",`rotate(${r.clock[1]*6} 60 60)`);}};
    inp.oninput=up;up();});
}
function hydrateGames(){
  hydrateSliders();
  app.querySelectorAll(".v-timeline").forEach(v=>{if(v.dataset.g)return;v.dataset.g="1";const items=[...v.querySelectorAll(".ti")];if(items.length<3)return;
    const b=document.createElement("button");b.className="btn sm play";b.textContent="▶ Play: put these in order";v.appendChild(b);
    b.onclick=()=>{const tl=v.querySelector(".tl");const orig=tl.innerHTML;const data=items.map((it,i)=>({i,y:it.querySelector(".y").innerHTML,x:it.querySelector(".x").innerHTML}));
      let next=0,miss=0;const sh=shuffle(data.slice());
      tl.innerHTML=`<div class="small muted" style="margin-bottom:6px">Tap the events from earliest to latest.</div>`+sh.map(d=>`<button class="og" data-i="${d.i}">${d.x}</button>`).join("");tl.classList.add("gaming");b.hidden=true;
      tl.querySelectorAll(".og").forEach(o=>o.onclick=()=>{if(o.classList.contains("ok"))return;if(+o.dataset.i===next){o.classList.add("ok");o.innerHTML=`<b>${data[next].y}</b> · ${data[next].x}`;next++;bump(1);
          if(next===data.length){const r=document.createElement("div");r.className="vc";r.innerHTML=(miss?`<b>Done</b> with ${miss} slip${miss>1?"s":""}.`:"<b>Perfect order!</b>")+` <button class="linkbtn" data-again>Show timeline</button>`;tl.appendChild(r);persist("s");
            r.querySelector("[data-again]").onclick=()=>{tl.innerHTML=orig;tl.classList.remove("gaming");b.hidden=false;};}}
        else{miss++;o.classList.add("no");setTimeout(()=>o.classList.remove("no"),450);}});};});
  app.querySelectorAll(".v-ladder,.v-cards").forEach(v=>{if(v.dataset.g)return;v.dataset.g="1";
    const sel=v.classList.contains("v-ladder")?".v":".k";const els=[...v.querySelectorAll(sel)];if(els.length<2)return;
    const b=document.createElement("button");b.className="btn sm play";b.textContent="Test me: hide the numbers";v.appendChild(b);
    b.onclick=()=>{const on=!v.classList.contains("hid");v.classList.toggle("hid",on);b.textContent=on?"Show all":"Test me: hide the numbers";els.forEach(e=>{e.classList.toggle("blur",on);e.onclick=on?()=>e.classList.remove("blur"):null;});};});
}
function hydrateDials(){
  hydrateGames();
  app.querySelectorAll(".dial").forEach(d=>{if(d.dataset.ready)return;d.dataset.ready="1";const inp=d.querySelector("input"),nd=d.querySelector(".needle"),db=d.querySelector(".db"),tm=d.querySelector(".tm");
    const upd=()=>{const v=+inp.value;nd.style.transformOrigin="120px 120px";nd.style.transform=`rotate(${(v-80)/40*180-90}deg)`;db.textContent=v+" dB(A)";
      if(v>115){tm.textContent="Not allowed at any duration";tm.style.color="var(--bad)";}
      else if(v<=90){tm.textContent=v===90?"8 hours a day (the limit)":"Within the 8-hour limit";tm.style.color="var(--good)";}
      else{const NT={90:"8 h",92:"6 h",95:"4 h",97:"3 h",100:"2 h",102:"1 h 30 min",105:"1 h",107:"45 min",110:"30 min",115:"15 min"};const h=8/Math.pow(2,(v-90)/5);const hh=Math.floor(h),mm=Math.round((h-hh)*60);tm.textContent=NT[v]?`Max ${NT[v]} a day`:`Max about ${hh?hh+" h ":""}${mm?mm+" min":""} a day`;tm.style.color=v>=105?"var(--bad)":"var(--gold)";}};
    inp.oninput=upd;upd();});
}

let CQ=null;
function viewCards(){
  if(!CQ||CQ.day!==dayNum()){const dk=deck();CQ={day:dayNum(),q:shuffle(dk.due).concat(dk.fresh),done:0,show:false};}
  if(!CQ.q.length){const d0=deck();if(d0.due.length+d0.fresh.length)CQ.q=shuffle(d0.due).concat(d0.fresh);}
  if(!CQ.q.length){const dk=deck();app.innerHTML=`<div class="stack"><a class="small" href="#practice">‹ Practice</a><h1>Flashcards</h1>
    <div class="card"><b>${dk.total?"All caught up for today.":"Your deck is empty."}</b><p class="small muted" style="margin:6px 0 0">${dk.total?`You've reviewed ${CQ.done} card${CQ.done===1?"":"s"} today. ${dk.learned} of ${dk.total} facts are in rotation; cards you know well come back after days or weeks.`:"Each lesson's key facts join the deck when you mark the lesson as done."}</p></div>
    <div class="card row" style="justify-content:space-between;align-items:center"><span class="small">New cards a day</span><span class="row" style="gap:6px">${[15,30,50].map(n=>`<button class="btn sm ${(S.newPerDay||30)===n?"primary":""}" data-npd="${n}">${n}</button>`).join("")}</span></div>
    <a class="btn" href="#home">Back to Today</a></div>`;app.querySelectorAll("[data-npd]").forEach(b=>b.onclick=()=>{S.newPerDay=+b.dataset.npd;persist("s");CQ=null;viewCards();});return;}
  const c=CQ.q[0]; const r=LIDX[c.lid]; const st=(S.cards||{})[c.id];
  const lab=n=>n<1?"<1 d":n+" d"; const i=st?st.i:0;
  const nxt={again:"today",hard:lab(Math.max(1,Math.round(i*1.2))),good:lab(i<1?1:Math.round(i*2.3)),easy:lab(i<1?4:Math.round(i*3.2))};
  app.innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><a class="small" href="#practice">‹ Practice</a><span class="small muted">${CQ.q.length} left · ${st?"review":"new"}</span></div>
    <div class="row" style="justify-content:space-between;align-items:center"><span class="row" style="gap:6px"><button class="btn sm" id="spk" aria-label="Read aloud">🔊 Read aloud</button><button class="btn sm" id="mic" aria-label="Say your answer" ${canListen()?"":"hidden"}>🎤 Say answer</button></span><a class="small" href="#voice" style="margin-left:auto;margin-right:10px">Voice</a><label class="small row" style="gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="autospk" ${S.cardSpeak?"checked":""}> Auto-read every card</label></div>
    <div class="fc" id="fc"><div class="small muted">${esc(r?r.l.title:"")}</div><div class="front">${esc(c.f)}</div>${CQ.show?`<div class="back">${esc(c.b)}</div>`:`<div class="small muted">Say the answer, then tap to check</div>`}<div class="said small" id="said" ${CQ.said?"":"hidden"}>${CQ.said?`You said: “${esc(CQ.said)}”`:""}</div>${CQ.show&&CQ.verdict?`<div class="verdict ${CQ.verdict.cls}">${CQ.verdict.msg}</div>`:""}</div>
    ${CQ.show?`<div class="rate">${["again","hard","good","easy"].map(k=>`<button class="btn ${(CQ.verdict?CQ.verdict.r===k:k==="easy")?"primary":""}" data-r="${k}">${k[0].toUpperCase()+k.slice(1)}<small>${nxt[k]}</small></button>`).join("")}</div>`:`<button class="btn primary" id="reveal">Show answer</button>`}
  </div>`;
  const rv=()=>{if(CQ.mic){CQ.mic.stop();CQ.mic=null;}CQ.show=true;viewCards();};
  const mic=$("#mic");
  if(!canListen())dictReady().then(d=>{if(d&&document.body.contains(mic))mic.hidden=false;});
  if(mic)mic.onclick=()=>{
    if(CQ.mic){CQ.mic.stop();return;}
    stopSay();const said=$("#said");said.hidden=false;said.textContent="Listening… say your answer";mic.textContent="⏹ Stop";mic.classList.add("primary");
    const cur=c;
    CQ.mic=listenOnce(t=>{if(CQ.q[0]===cur&&document.body.contains(said))said.textContent="You said: “"+t+"”";},(t,why)=>{
      CQ.mic=null;if(CQ.q[0]!==cur)return;
      if(!t){if(document.body.contains(said)){said.textContent=why==="not_granted"||why==="not-allowed"?"Microphone permission was refused. You can still tap to check.":"Didn't catch that. Tap 🎤 and try again.";mic.textContent="🎤 Say answer";mic.classList.remove("primary");}return;}
      CQ.said=t;const m=matchScore(t,cur.b);
      const chips=m.parts.map(p=>`<span class="pc ${p.ok?"y":"n"}">${p.ok?(p.approx?"≈ ":"✓ "):""}${esc(p.text)}${p.approx?" (close enough)":""}</span>`).join("")+(m.wrongNum.length?`<span class="pc x">✗ you said ${esc(m.wrongNum.join(", "))}</span>`:"");
      const head=m.wrongNum.length?"✗ Wrong number. Suggested: Again":m.score>=0.75?"✓ Looks right. Suggested: Good (tap Easy if it was instant)":m.score>=0.4?"½ Partly right. Suggested: Hard":"✗ Doesn't match. Suggested: Again";
      CQ.verdict={r:m.wrongNum.length?"again":m.score>=0.75?"good":m.score>=0.4?"hard":"again",cls:m.wrongNum.length?"no":m.score>=0.75?"ok":m.score>=0.4?"part":"no",msg:head+`<div class="pcs">${chips}</div><div class="small muted" style="font-weight:400">Ticked = parts you said; dashed = not said. You can still choose any rating.</div>`};
      CQ.show=true;viewCards();if(S.cardSpeak)say(cur.b);});
  };
  $("#fc").onclick=()=>{if(!CQ.show)rv();}; const b=$("#reveal"); if(b)b.onclick=rv;
  $("#spk").onclick=()=>say(CQ.show?c.f+". "+c.b:c.f);
  $("#autospk").onchange=e=>{S.cardSpeak=e.target.checked?1:0;persist("s");if(S.cardSpeak)say(CQ.show?c.b:c.f);else stopSay();};
  if(S.cardSpeak)say(CQ.show?c.b:c.f);
  app.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{const r2=x.dataset.r;rateCard(c,r2);CQ.q.shift();if(r2==="again")CQ.q.push(c);CQ.done++;CQ.show=false;CQ.said="";CQ.verdict=null;viewCards();});
}
